name: CI
# THROWAWAY (branch mutation/booking-redaction-test, never merged): proves the booking redaction test fails when its guarded line is reverted (SOLVELT_MUT=Mn, src/Solvelt.Api/Mut.cs).
on:
  push: { branches: ['mutation/**'] }
jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release tests/Solvelt.Api.Tests
      - name: baseline and one run per mutation
        run: |
          set +e
          F="FullyQualifiedName~Solvelt.Api.Tests.BookingMessagingTests.Message_texts_are_removed_when_the_booking_is_redacted"
          run() { SOLVELT_MUT=$1 dotnet test tests/Solvelt.Api.Tests --no-build -c Release --filter "$F" --logger "console;verbosity=normal" > "$1.txt" 2>&1; local code=$?; echo "== MUT $1 exit=$code $(grep -E '^\s*(Passed|Failed)!|Total tests' "$1.txt" | tail -1 | tr -s ' ')"; grep -oE '^\s+Failed [A-Za-z0-9_.]+' "$1.txt" | sed 's/^ *Failed /   FAILED /' | sort -u; }
          run NONE
          for m in M30; do run $m; done
          exit 0
